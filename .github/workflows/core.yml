name: Venera OpenList Core

on:
  pull_request:
  push:
    branches: [main]
    tags: ["core-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Check formatting and version
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' VERSION
          test "$(wc -l < VERSION)" -eq 1
          test -z "$(gofmt -l native/openlist_core)"
          python3 -m py_compile .github/scripts/*.py
          python3 -m unittest discover .github/scripts/tests -v
          go test ./native/openlist_core/...

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    if: github.event_name != 'push' || github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-22.04
            python: python3
          - target: ios
            runner: macos-15
            python: python3
          - target: windows-x64
            runner: windows-2025
            python: python
          - target: macos-universal
            runner: macos-15
            python: python3
          - target: linux-x64
            runner: ubuntu-22.04
            python: python3
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            python: python3
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Select Xcode 16.4
        if: matrix.target == 'ios' || matrix.target == 'macos-universal'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install Android NDK 28
        if: matrix.target == 'android'
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
      - name: Select Windows x64 MinGW compiler
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $compiler = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if ($null -eq $compiler) { throw 'OpenList C ABI requires x64 MinGW gcc.exe.' }
          $target = & $compiler.Source -dumpmachine
          if ($target -notmatch '^x86_64-w64-mingw32') { throw "Expected x64 MinGW gcc.exe, got $target" }
          "CC=$($compiler.Source)" >> $env:GITHUB_ENV
      - name: Build and package embedded core
        env:
          ANDROID_NDK_HOME: ${{ matrix.target == 'android' && format('{0}/ndk/28.0.13004108', env.ANDROID_HOME) || '' }}
        run: ${{ matrix.python }} .github/scripts/build_openlist_core.py ${{ matrix.target }}
      - name: Upload packaged core
        uses: actions/upload-artifact@v4
        with:
          name: openlist-core-${{ matrix.target }}
          path: dist/openlist-core-${{ matrix.target }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Confirm version tag
        run: test "${GITHUB_REF_NAME}" = "core-v$(cat VERSION)"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create verified manifest
        run: python3 .github/scripts/create_release_manifest.py
      - name: Refuse existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; published assets are immutable." >&2
            exit 1
          fi
      - name: Publish beta core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## **注意**
          **beta版可能存在大量bug，请勿下载**

          VeneraPlus embedded OpenList Core release.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --prerelease --notes-file release-notes.md \
            dist/openlist-core-*.zip dist/manifest.json
